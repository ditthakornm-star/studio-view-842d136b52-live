<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><title>Private showroom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f2;color:#1e1c23;font-family:Inter,Arial,sans-serif}main{min-height:100svh;display:grid;place-items:center;padding:24px}.panel{width:min(100%,380px)}h1{font-size:clamp(2rem,6vw,2.8rem);font-weight:550;letter-spacing:-.055em;margin:0 0 2rem}form{display:grid;gap:10px}label{font-size:.95rem;font-weight:550}input,button{font:inherit;border-radius:8px;min-height:48px;padding:.75rem 1rem}input{border:1px solid #9b98a0;background:#fff}input:focus-visible,button:focus-visible{outline:3px solid #74668e;outline-offset:2px}button{margin-top:6px;color:#fff;background:#29252f;border:0;font-weight:600;cursor:pointer}button:disabled{opacity:.7;cursor:wait}p{margin:.9rem 0 0;min-height:1.6em;line-height:1.5;color:#514c58}[hidden]{display:none}
</style></head><body><main><section class="panel"><h1>Private showroom</h1><form id="entry"><label for="pass">Password</label><input id="pass" type="password" autocomplete="current-password" required autocapitalize="off" spellcheck="false"><button type="submit">Enter showroom</button></form><p id="status" role="status" aria-live="polite"></p><noscript>Enable JavaScript to open the showroom.</noscript></section></main>
<script>
(() => {
  const settings = {"salt":"8QrSfffolLOiKcfbbUz6mg","iv":"DjFqpl7cefYcZsW2","wrapped":"VX_ju-U0mg7XWPCAtHgpBXPAck9OsfgmF02pf0LLNXw3xyewfRroYgKOz0Xrwt0Z","file":"./review-9945c1de604f74af.bin","bootstrap":13198167,"total":38708509};
  const form = document.querySelector('#entry');
  const input = document.querySelector('#pass');
  const status = document.querySelector('#status');
  const button = form.querySelector('button');
  const link = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!link || !/^[A-Za-z0-9_-]{43}$/.test(link)) {
    form.hidden = true;
    status.textContent = 'Open the full viewing link you received.';
    return;
  }
  function bytes(s) {
    return Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));
  }
  const utf8 = new TextEncoder();
  const aad = utf8.encode('private-showroom/access/v1');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (button.disabled) return;
    button.disabled = true;
    status.textContent = 'Checking password…';
    try {
      const salt = new Uint8Array(48);
      salt.set(bytes(settings.salt)); salt.set(bytes(link),16);
      const material = await crypto.subtle.importKey('raw',utf8.encode(input.value),'PBKDF2',false,['deriveKey']);
      const wrapper = await crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:600000},material,{name:'AES-GCM',length:256},false,['decrypt']);
      let raw;
      try {
        raw = await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes(settings.iv),additionalData:aad},wrapper,bytes(settings.wrapped));
      } catch {
        status.textContent = 'The link or password is incorrect.';
        input.select(); input.focus(); return;
      }
      const mediaKey = await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
      new Uint8Array(raw).fill(0);
      status.textContent = 'Opening showroom…';
      const archive = new URL(settings.file, location.href).href;
      let fullCopy;
      async function readRange(start, length, signal) {
        if (fullCopy) return (await fullCopy).subarray(start, start + length);
        const response = await fetch(archive, {
          headers: { Range: 'bytes=' + start + '-' + (start + length - 1) },
          credentials: 'omit', referrerPolicy: 'no-referrer', signal
        });
        if (response.status === 200) {
          fullCopy = response.arrayBuffer().then(buffer => {
            if (buffer.byteLength !== settings.total) throw Error('Incomplete media');
            return new Uint8Array(buffer);
          }).catch(error => { fullCopy = null; throw error; });
          return (await fullCopy).subarray(start, start + length);
        }
        if (response.status !== 206) throw Error('Media unavailable');
        const block = new Uint8Array(await response.arrayBuffer());
        if (block.length !== length) throw Error('Incomplete view');
        return block;
      }
      async function loadView(id, entry, signal) {
        const [offset, length] = entry;
        const block = await readRange(settings.bootstrap + offset, length, signal);
        const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv:block.subarray(0,12),
          additionalData:utf8.encode('private-showroom/hd/v1/'+id)},mediaKey,block.subarray(12));
        return new Blob([clear], {type:'image/webp'});
      }
      const file = await readRange(0, settings.bootstrap);

      const clear = await crypto.subtle.decrypt({name:'AES-GCM',iv:file.subarray(0,12),additionalData:utf8.encode('private-showroom/media/v1')},mediaKey,file.subarray(12));
      const stream = new Blob([clear]).stream().pipeThrough(new DecompressionStream('gzip'));
      const html = await new Response(stream).text();
      input.value = '';
      document.open();window.loadReviewView=loadView;document.write(html);document.close();
    } catch {
      status.textContent = 'The showroom could not load. Please retry in a current browser.';
    } finally { button.disabled = false; }
  });
})();
</script></body></html>
